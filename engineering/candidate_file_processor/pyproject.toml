[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-file-processor"
version = "0.1.0"
description = "A CLI tool for processing and evaluating candidate data."
requires-python = ">=3.11"

dependencies = [
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
candidate-processor = "candidate_processor.cli:main"